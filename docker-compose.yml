services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agrici
      POSTGRES_USER: agrici
      POSTGRES_PASSWORD: agrici_dev
    ports: ["5432:5432"]
    volumes: [agrici_postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrici -d agrici"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  backend:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  agrici_postgres_data:
