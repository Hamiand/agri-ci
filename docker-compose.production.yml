services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    command: ["uvicorn","app.main:app","--host","0.0.0.0","--port","8000","--proxy-headers"]
  web:
    build: ./web
    restart: unless-stopped
