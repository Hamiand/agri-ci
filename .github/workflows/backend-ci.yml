name: AGRI-CI Backend CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agrici
          POSTGRES_PASSWORD: agrici_test
          POSTGRES_DB: agrici_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agrici -d agrici_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      PYTHONPATH: ./backend
      DATABASE_URL: postgresql+psycopg://agrici:agrici_test@localhost:5432/agrici_test
      TEST_DATABASE_URL: postgresql+psycopg://agrici:agrici_test@localhost:5432/agrici_test
      REDIS_URL: redis://localhost:6379/0
      PAYMENT_WEBHOOK_SECRET: ci-payment-webhook-secret-change-this
      CORS_ORIGINS: http://localhost:3000
      APP_ENV: staging
      JWT_SECRET: ci-only-secret-change-me
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-build-isolation
      - run: python -m compileall -q app tests
      - run: python scripts/commercial_gate.py
      - run: bash -n scripts/backup_postgres.sh scripts/restore_postgres.sh
      - run: python scripts/preflight.py
      - run: alembic upgrade head
      - name: Import FastAPI application
        run: python -c "from app.main import app; print(app.title)"
      - run: pytest -q -m "not integration" || pytest -q
      - name: PostgreSQL AGRI-CI integration and race tests
        run: pytest -q tests/integration

# Runtime proof summary is generated by pytest jobs above:
# migration -> app import -> route inventory -> state machine -> PostgreSQL concurrency -> idempotency replay.

# AGRI-CI-001 route contract is part of the normal pytest suite.
# `scripts/rc1_gate.py` is intentionally NOT forced green here; it requires observed runtime evidence.

# RC1 evidence is intentionally produced only by successful runtime commands.
# Recommended final CI step:
#   bash scripts/collect_rc1_evidence.sh
#   python scripts/rc1_gate.py

  rc1-runtime-proof:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agrci
          POSTGRES_PASSWORD: agrci_ci
          POSTGRES_DB: agrci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agrci -d agrci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://agrci:agrci_ci@localhost:5432/agrci
      TEST_DATABASE_URL: postgresql+psycopg://agrci:agrci_ci@localhost:5432/agrci
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: staging
      JWT_SECRET: ci-runtime-proof-secret-not-for-production
      PAYMENT_WEBHOOK_SECRET: ci-runtime-payment-secret-not-for-production
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-build-isolation
          python scripts/dependency_doctor.py
      - name: Preflight
        run: python scripts/preflight.py
      - name: Collect RC1 runtime evidence
        run: bash scripts/collect_rc1_evidence.sh
      - name: Enforce RC1 software gate
        run: python scripts/rc1_gate.py
      - name: Upload RC1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agrici-rc1-evidence
          path: backend/.rc1-evidence/
          if-no-files-found: ignore
